<!-- MODAL FACTURA / BOLETA - VERSIÓN CON RETENCIÓN DE IGV (3%) -->
<div class="modal-bg" id="comprobanteModal">
    <div class="modal-box" style="width:min(1100px,96vw)">
        <div class="modal-head">
            <div class="modal-title" id="comprobanteModalTitle">🧾 Factura / Boleta</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('comprobanteModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="comprobanteForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <!-- Pie ordenado (Erika 26/10/2026): a la izquierda las descargas para el portal del cliente, a la derecha guardar -->
        <div class="modal-foot pie-factura">
            <div class="pie-descargas">
                <span class="pie-tit">Para el portal del cliente:</span>
                <button type="button" class="btn btn-soft btn-desc-fac" id="btnFacPdf" onclick="pieDescargarPdf()">⬇ Descargar PDF</button>
                <button type="button" class="btn btn-soft btn-desc-fac" id="btnFacXml" onclick="pieDescargarXml()">⬇ Descargar XML</button>
            </div>
            <div class="pie-guardar">
                <button class="btn btn-secondary" onclick="closeModal('comprobanteModal')">Cancelar</button>
                <button class="btn btn-soft" onclick="saveComprobante('Borrador')">💾 Guardar como borrador</button>
                <button class="btn btn-green" onclick="saveComprobante('Emitido')">📄 Emitir comprobante</button>
            </div>
        </div>
    </div>
</div>
