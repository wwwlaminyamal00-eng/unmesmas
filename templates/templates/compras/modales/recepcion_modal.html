<!-- MODAL RECEPCIÓN DE MERCADERÍA - VERSIÓN PROFESIONAL -->
<div class="modal-bg" id="recepcionModal">
    <div class="modal-box" style="width:min(1150px,97vw); max-height:92vh; display:flex; flex-direction:column;">
        <div class="modal-head" style="padding:10px 18px; min-height:42px; flex-shrink:0;">
            <div>
                <div class="modal-title" id="recepcionModalTitle">📦 Recepción de mercadería</div>
                <p style="color:#94A3B8; font-size:11px; font-weight:700; margin:2px 0 0 0;">
                    Registra el ingreso físico y verifica contra la orden de compra
                </p>
            </div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('recepcionModal')">✕ Cerrar</button>
        </div>

        <div class="modal-body" id="recepcionForm" style="flex:1 1 auto; overflow-y:auto; padding:14px 18px; background:#F8FAFC;">

            <!-- SECCIÓN 1: DATOS GENERALES -->
            <div class="ficha-section">
                <div class="ficha-section-title">📄 Datos de la recepción</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>N° Recepción <span class="text-danger">*</span></label>
                        <input id="recNumero" readonly style="background:#F1F5F9; font-weight:900; color:#2563EB;">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha recepción <span class="text-danger">*</span></label>
                        <input id="recFecha" type="date">
                    </div>
                    <div class="form-field col-6">
                        <label>Orden de compra <span class="text-danger">*</span></label>
                        <div style="display:flex; gap:6px;">
                            <input id="recOrden" placeholder="OC-20260713-0001" style="flex:1;" oninput="recBuscarOrden()">
                            <button type="button" onclick="recBuscarOrden(true)" style="height:30px; padding:0 12px; border-radius:9px; background:#2563EB; color:#fff; border:0; font-weight:900; cursor:pointer; font-size:11px;">🔍 Buscar</button>
                        </div>
                    </div>
                    <div class="form-field col-6">
                        <label>Proveedor</label>
                        <input id="recProveedor" placeholder="Nombre del proveedor" readonly style="background:#F1F5F9;">
                    </div>
                    <div class="form-field col-6">
                        <label>Guía de remisión proveedor</label>
                        <input id="recGuiaProveedor" placeholder="Ej: T001-00001234">
                    </div>
                    <div class="form-field col-3">
                        <label>Transportista</label>
                        <input id="recTransportista" placeholder="Nombre del transportista">
                    </div>
                    <div class="form-field col-3">
                        <label>Placa vehículo</label>
                        <input id="recPlaca" placeholder="ABC-123" style="text-transform:uppercase;">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: PRODUCTOS RECIBIDOS -->
            <div class="ficha-section">
                <div class="ficha-section-title">
                    📦 Productos recibidos
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="btn btn-blue" onclick="addRecepcionItemRow()" style="height:26px; padding:0 12px; font-size:10px; border-radius:7px; font-weight:900;">+ Agregar producto</button>
                    </div>
                </div>
                <div style="overflow-x:auto; padding:6px 10px 10px;">
                    <table class="master-table" style="font-size:11px; min-width:900px; width:100%;">
                        <thead>
                            <tr>
                                <th style="width:35px;">#</th>
                                <th>Producto</th>
                                <th style="width:80px;">Cant. OC</th>
                                <th style="width:80px;">Cant. Recibida</th>
                                <th style="width:80px;">Unidad</th>
                                <th style="width:130px;">Estado</th>
                                <th style="width:60px;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="recepcionItemsBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- SECCIÓN 3: VERIFICACIÓN Y OBSERVACIONES -->
            <div class="ficha-section">
                <div class="ficha-section-title">✅ Verificación de recepción</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>Estado general</label>
                        <select id="recEstadoMercaderia">
                            <option value="Buen estado">✅ Buen estado</option>
                            <option value="Con observaciones">⚠️ Con observaciones</option>
                            <option value="Dañado">❌ Dañado</option>
                            <option value="Incompleto">📦 Incompleto</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>¿Cumple especificaciones?</label>
                        <select id="recCumpleEspecificaciones">
                            <option value="Sí">✅ Sí</option>
                            <option value="No">❌ No</option>
                            <option value="Parcialmente">⚠️ Parcialmente</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Responsable de recepción</label>
                        <input id="recResponsable" placeholder="Nombre del responsable">
                    </div>
                    <div class="form-field col-3">
                        <label>Almacén destino</label>
                        <select id="recAlmacen">
                            <option value="ALM-SMP">ALM-SMP (San Martín de Porres)</option>
                            <option value="ALM-BRE">ALM-BRE (Breña)</option>
                            <option value="ALM-CENTRAL">ALM-CENTRAL</option>
                        </select>
                    </div>
                    <div class="form-field col-12">
                        <label>Observaciones</label>
                        <textarea id="recObs" placeholder="Detalles de la recepción, incidencias, etc." rows="3"></textarea>
                    </div>
                </div>
            </div>

        </div>

        <div class="modal-foot" style="padding:10px 18px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #E5E7EB; background:#fff; flex-shrink:0;">
            <button class="btn btn-secondary" onclick="closeModal('recepcionModal')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">Cancelar</button>
            <button class="btn btn-soft" onclick="saveRecepcion('Pendiente')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">💾 Guardar pendiente</button>
            <button class="btn btn-green" onclick="saveRecepcion('Aprobada')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">✅ Aprobar recepción</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// RECEPCIÓN - FUNCIONES PROFESIONALES
// ============================================================

function addRecepcionItemRow(item = {}) {
    const tbody = document.getElementById('recepcionItemsBody');
    if (!tbody) return;
    const count = tbody.children.length + 1;

    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td style="font-weight:900; text-align:center;">${count}</td>
        <td><input class="rec-item-prod" value="${item.producto || ''}" placeholder="Descripción del producto" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px;"></td>
        <td><input class="rec-item-cant-oc" type="number" value="${item.cantidad_oc || 0}" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px; text-align:center;"></td>
        <td><input class="rec-item-cant-rec" type="number" value="${item.cantidad_rec || item.cantidad || 1}" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px; text-align:center; font-weight:900;"></td>
        <td>
            <select class="rec-item-unidad" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; font-size:10px; padding:0 4px;">
                <option value="UND" ${item.unidad==='UND'?'selected':''}>UND</option>
                <option value="KG" ${item.unidad==='KG'?'selected':''}>KG</option>
                <option value="LTS" ${item.unidad==='LTS'?'selected':''}>LTS</option>
                <option value="MTS" ${item.unidad==='MTS'?'selected':''}>MTS</option>
                <option value="CJA" ${item.unidad==='CJA'?'selected':''}>CJA</option>
            </select>
        </td>
        <td>
            <select class="rec-item-estado" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; font-size:10px; padding:0 4px;">
                <option value="Buen estado">✅ Buen estado</option>
                <option value="Con observaciones">⚠️ Con observaciones</option>
                <option value="Dañado">❌ Dañado</option>
                <option value="Incompleto">📦 Incompleto</option>
            </select>
        </td>
        <td style="text-align:center;">
            <button type="button" onclick="this.closest('tr').remove(); recReordenar();" style="background:#FEE2E2; border:0; color:#DC2626; cursor:pointer; font-size:12px; font-weight:900; padding:3px 7px; border-radius:6px;">✕</button>
        </td>
    `;
    tbody.appendChild(tr);
}

function recReordenar() {
    document.querySelectorAll('#recepcionItemsBody tr').forEach((row, idx) => {
        row.querySelector('td:first-child').textContent = idx + 1;
    });
}

async function recBuscarOrden(force = false) {
    const ordenInput = document.getElementById('recOrden');
    const numOrden = (ordenInput.value || '').trim();

    if (!force) {
        clearTimeout(window._recOrdenTimer);
        window._recOrdenTimer = setTimeout(() => { if (numOrden.length >= 6) recBuscarOrden(true); }, 700);
        return;
    }

    if (!numOrden) { showToast('⚠️ Ingresa el N° de orden', 'warning'); return; }

    try {
        const resp = await fetch(`/compras/api/ordenes/buscar?q=${encodeURIComponent(numOrden)}`);
        const data = await resp.json();
        if (data.success && data.data && data.data.length > 0) {
            const oc = data.data[0];
            document.getElementById('recProveedor').value = oc.proveedor || '';
            // Si el endpoint devolviera items, cargarlos; si no, deja una fila vacía
            if (oc.items && oc.items.length > 0) {
                const tbody = document.getElementById('recepcionItemsBody');
                tbody.innerHTML = '';
                oc.items.forEach(it => addRecepcionItemRow({
                    producto: it.producto,
                    cantidad_oc: it.cantidad,
                    cantidad_rec: it.cantidad,
                    unidad: it.unidad || 'UND'
                }));
            }
            showToast(`✅ Orden ${oc.numero_orden} cargada`, 'success');
        } else {
            showToast('⚠️ Orden no encontrada. Puedes registrar los productos manualmente.', 'warning');
        }
    } catch (e) {
        console.error(e);
        showToast('❌ Error buscando orden', 'error');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('recepcionModal');
    if (modal) {
        const observer = new MutationObserver(() => {
            if (modal.classList.contains('show')) {
                const tbody = document.getElementById('recepcionItemsBody');
                if (tbody && tbody.children.length === 0) addRecepcionItemRow();
            }
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
    }
});

console.log('✅ Funciones del modal Recepción cargadas');
</script>
