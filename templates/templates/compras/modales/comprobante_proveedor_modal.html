<!-- MODAL COMPROBANTE PROVEEDOR - VERSIÓN PROFESIONAL -->
<div class="modal-bg" id="comprobanteProveedorModal">
    <div class="modal-box" style="width:min(1000px,96vw); max-height:92vh; display:flex; flex-direction:column;">
        <div class="modal-head" style="padding:10px 18px; min-height:42px; flex-shrink:0;">
            <div>
                <div class="modal-title" id="compProvModalTitle">🧾 Registrar comprobante de proveedor</div>
                <p style="color:#94A3B8; font-size:11px; font-weight:700; margin:2px 0 0 0;">
                    Factura, boleta o nota de crédito recibida del proveedor
                </p>
            </div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('comprobanteProveedorModal')">✕ Cerrar</button>
        </div>

        <div class="modal-body" id="compProvForm" style="flex:1 1 auto; overflow-y:auto; padding:14px 18px; background:#F8FAFC;">

            <!-- SECCIÓN 1: DATOS DEL COMPROBANTE -->
            <div class="ficha-section">
                <div class="ficha-section-title">🧾 Datos del comprobante</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>Tipo <span class="text-danger">*</span></label>
                        <select id="cpTipo">
                            <option value="Factura">Factura</option>
                            <option value="Boleta">Boleta</option>
                            <option value="Nota de crédito">Nota de crédito</option>
                            <option value="Nota de débito">Nota de débito</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Serie</label>
                        <input id="cpSerie" placeholder="F001" maxlength="4" style="text-transform:uppercase;">
                    </div>
                    <div class="form-field col-3">
                        <label>Número <span class="text-danger">*</span></label>
                        <input id="cpNumero" placeholder="00000001" maxlength="10">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha emisión <span class="text-danger">*</span></label>
                        <input id="cpFecha" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha vencimiento</label>
                        <input id="cpFechaVencimiento" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Moneda</label>
                        <select id="cpMoneda">
                            <option value="Soles (S/)">Soles (S/)</option>
                            <option value="Dólares ($)">Dólares ($)</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Subtotal</label>
                        <input id="cpSubtotal" type="number" step="0.01" value="0" oninput="cpRecalcular()">
                    </div>
                    <div class="form-field col-3">
                        <label>Monto total <span class="text-danger">*</span></label>
                        <input id="cpMonto" type="number" step="0.01" value="0" oninput="cpRecalcular(true)" style="font-weight:900;">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: PROVEEDOR -->
<div class="ficha-section">
    <div class="ficha-section-title">🏢 Datos del proveedor</div>
    <div class="ficha-grid">

        <!-- Fila 1: RUC (4) + Razón social (8) -->
        <div class="form-field col-4">
            <label>RUC <span class="text-danger">*</span></label>
            <div class="input-with-btn">
                <input id="cpRuc" placeholder="11 dígitos" maxlength="11"
                       oninput="cpBuscarProveedor()">
                <button type="button" onclick="cpBuscarProveedor(true)" title="Consultar SUNAT">🌞</button>
            </div>
        </div>

        <div class="form-field col-8">
            <label>Razón social <span class="text-danger">*</span></label>
            <input id="cpProveedor" placeholder="Nombre o razón social">
        </div>

        <!-- Fila 2: Dirección (6) + Orden de compra relacionada (6) -->
        <div class="form-field col-6">
            <label>Dirección</label>
            <input id="cpDireccion" placeholder="Dirección fiscal">
        </div>

        <div class="form-field col-6">
            <label>Orden de compra relacionada</label>
            <input id="cpOrden" placeholder="OC-20260713-0001">
        </div>

    </div>
</div>
            <!-- SECCIÓN 3: OBSERVACIONES -->
            <div class="ficha-section">
                <div class="ficha-section-title">📝 Observaciones</div>
                <div class="ficha-grid">
                    <div class="form-field col-12">
                        <textarea id="cpObs" placeholder="Observaciones del comprobante..." rows="3"></textarea>
                    </div>
                </div>
            </div>

        </div>

        <div class="modal-foot" style="padding:10px 18px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #E5E7EB; background:#fff; flex-shrink:0;">
            <button class="btn btn-secondary" onclick="closeModal('comprobanteProveedorModal')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">Cancelar</button>
            <button class="btn btn-soft" onclick="saveComprobanteProveedor('Pendiente')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">💾 Guardar pendiente</button>
            <button class="btn btn-primary" onclick="saveComprobanteProveedor('Registrado')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">✅ Registrar comprobante</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// COMPROBANTE PROVEEDOR - FUNCIONES PROFESIONALES
// ============================================================

function cpRecalcular(fromMonto = false) {
    const subtotalEl = document.getElementById('cpSubtotal');
    const montoEl = document.getElementById('cpMonto');
    if (!subtotalEl || !montoEl) return;

    if (fromMonto) {
        const monto = parseFloat(montoEl.value) || 0;
        subtotalEl.value = (monto / 1.18).toFixed(2);
    }
}

function cpBuscarProveedor(force = false) {
    const rucInput = document.getElementById('cpRuc');
    const ruc = (rucInput.value || '').replace(/\D/g, '').trim();

    if (!force) {
        clearTimeout(window._cpRucTimer);
        window._cpRucTimer = setTimeout(() => { if (ruc.length === 11) cpBuscarProveedor(true); }, 700);
        return;
    }

    if (ruc.length !== 11) { showToast('⚠️ RUC de 11 dígitos requerido', 'warning'); return; }

    fetch(`/compras/api/proveedores/buscar?q=${ruc}`)
        .then(r => r.json())
        .then(data => {
            if (data.success && data.data && data.data.length > 0) {
                const p = data.data[0];
                document.getElementById('cpProveedor').value = p.razon_social || '';
                document.getElementById('cpDireccion').value = p.direccion || '';
                showToast(`✅ Proveedor: ${p.razon_social}`, 'success');
                return;
            }
            return fetch(`/api/sunat/consulta?ruc=${ruc}`)
                .then(r => r.json())
                .then(sunat => {
                    if (sunat.success) {
                        document.getElementById('cpProveedor').value = sunat.razon_social || '';
                        document.getElementById('cpDireccion').value = sunat.direccion || '';
                        showToast('🌞 Datos cargados desde SUNAT', 'info');
                    } else {
                        showToast('⚠️ No se encontró el RUC', 'warning');
                    }
                });
        })
        .catch(e => { console.error(e); showToast('❌ Error consultando proveedor', 'error'); });
}

console.log('✅ Funciones del modal Comprobante Proveedor cargadas');
</script>
