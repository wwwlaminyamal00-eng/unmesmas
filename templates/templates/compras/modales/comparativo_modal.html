<!-- MODAL COMPARATIVO DE PROVEEDORES - VERSIÓN PROFESIONAL -->
<div class="modal-bg" id="comparativoModal">
    <div class="modal-box" style="width:min(1200px,97vw); max-height:92vh; display:flex; flex-direction:column;">
        <div class="modal-head" style="padding:10px 18px; min-height:42px; flex-shrink:0;">
            <div>
                <div class="modal-title" id="comparativoModalTitle">📊 Nuevo comparativo de proveedores</div>
                <p style="color:#94A3B8; font-size:11px; font-weight:700; margin:2px 0 0 0;">
                    Compara precios, plazos y condiciones de pago
                </p>
            </div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('comparativoModal')">✕ Cerrar</button>
        </div>

        <div class="modal-body" id="comparativoForm" style="flex:1 1 auto; overflow-y:auto; padding:14px 18px; background:#F8FAFC;">

            <!-- SECCIÓN 1: DATOS GENERALES -->
            <div class="ficha-section">
                <div class="ficha-section-title">📄 Datos del comparativo</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>N° Comparativo <span class="text-danger">*</span></label>
                        <input id="compNumero" readonly style="background:#F1F5F9; font-weight:900; color:#2563EB;">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha <span class="text-danger">*</span></label>
                        <input id="compFecha" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Moneda</label>
                        <select id="compMoneda">
                            <option value="Soles (S/)">Soles (S/)</option>
                            <option value="Dólares ($)">Dólares ($)</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Prioridad</label>
                        <select id="compPrioridad">
                            <option value="Baja">🟢 Baja</option>
                            <option value="Media" selected>🟡 Media</option>
                            <option value="Alta">🟠 Alta</option>
                            <option value="Urgente">🔴 Urgente</option>
                        </select>
                    </div>
                    <div class="form-field col-12">
                        <label>Producto a cotizar <span class="text-danger">*</span></label>
                        <input id="compProducto" placeholder="Descripción del producto o servicio a comparar" maxlength="200">
                    </div>
                    <div class="form-field col-3">
                        <label>Cantidad</label>
                        <input id="compCantidad" type="number" value="1" min="0.01" step="0.01" oninput="compRecalcularTodo()">
                    </div>
                    <div class="form-field col-3">
                        <label>Unidad</label>
                        <select id="compUnidad">
                            <option value="UND">UND</option>
                            <option value="KG">KG</option>
                            <option value="LTS">LTS</option>
                            <option value="MTS">MTS</option>
                            <option value="CJA">CJA</option>
                        </select>
                    </div>
                    <div class="form-field col-6">
                        <label>Observaciones generales</label>
                        <input id="compObservaciones" placeholder="Comentarios del comparativo">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: PROVEEDORES -->
            <div class="ficha-section">
               <div class="ficha-section-title">
    🏢 Proveedores participantes
    <div style="display:flex; gap:6px;">
        <button type="button" class="btn btn-green" 
                onclick="openProductSelectorCompras(items => {
                    if (items.length > 0) {
                        document.getElementById('compProducto').value = items[0].producto || items[0].descripcion;
                        document.getElementById('compCantidad').value = items[0].cantidad || 1;
                        document.getElementById('compUnidad').value = items[0].um || 'UND';
                        compRecalcularTodo();
                    }
                })"
                style="height:26px; padding:0 12px; font-size:10px; border-radius:7px; font-weight:900; background:#16A34A; color:#fff; border:0; cursor:pointer;">
            📋 Seleccionar producto
        </button>
        <button type="button" class="btn btn-blue" onclick="addComparativoRow()" style="height:26px; padding:0 12px; font-size:10px; border-radius:7px; font-weight:900;">+ Proveedor</button>
    </div>
</div>
                <div style="overflow-x:auto; padding:6px 10px 10px;">
                    <table class="master-table" style="font-size:11px; min-width:1000px; width:100%;">
                        <thead>
                            <tr>
                                <th style="width:35px;">#</th>
                                <th style="width:200px;">Proveedor <span class="text-danger">*</span></th>
                                <th style="width:100px;">RUC</th>
                                <th style="width:90px;">Precio Unit.</th>
                                <th style="width:90px;">Subtotal</th>
                                <th style="width:80px;">Plazo (días)</th>
                                <th style="width:110px;">Cond. Pago</th>
                                <th style="width:100px;">Garantía</th>
                                <th style="width:70px;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="comparativoItemsBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- SECCIÓN 3: RESUMEN / MEJOR OPCIÓN -->
            <div class="ficha-section" style="background:#F0FDF4; border-color:#86EFAC;">
                <div class="ficha-section-title" style="background:#DCFCE7; color:#166534; border-color:#86EFAC;">
                    🏆 Mejor opción detectada automáticamente
                </div>
                <div class="ficha-grid" style="padding:12px;">
                    <div class="form-field col-3">
                        <label>Mejor precio</label>
                        <input id="compMejorPrecio" readonly style="background:#FFFFFF; font-weight:900; color:#059669;">
                    </div>
                    <div class="form-field col-3">
                        <label>Proveedor con mejor precio</label>
                        <input id="compMejorProveedor" readonly style="background:#FFFFFF; font-weight:900;">
                    </div>
                    <div class="form-field col-3">
                        <label>Mejor plazo de entrega</label>
                        <input id="compMejorPlazo" readonly style="background:#FFFFFF; font-weight:900; color:#2563EB;">
                    </div>
                    <div class="form-field col-3">
                        <label>Proveedor más rápido</label>
                        <input id="compMejorProveedorPlazo" readonly style="background:#FFFFFF; font-weight:900;">
                    </div>
                </div>
            </div>

        </div>

        <div class="modal-foot" style="padding:10px 18px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #E5E7EB; background:#fff; flex-shrink:0;">
            <button class="btn btn-secondary" onclick="closeModal('comparativoModal')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">Cancelar</button>
            <button class="btn btn-soft" onclick="saveComparativo('Borrador')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">💾 Guardar borrador</button>
            <button class="btn btn-primary" onclick="saveComparativo('En evaluación')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">📤 Enviar a evaluación</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// COMPARATIVO - FUNCIONES PROFESIONALES
// ============================================================

function addComparativoRow() {
    const tbody = document.getElementById('comparativoItemsBody');
    if (!tbody) return;
    const count = tbody.children.length + 1;

    const tr = document.createElement('tr');
    tr.dataset.rowId = count;
    tr.innerHTML = `
        <td style="font-weight:900; text-align:center;">${count}</td>
        <td>
            <input class="cmp-prov-nombre" placeholder="Nombre proveedor" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px;">
        </td>
        <td>
            <div style="display:flex; gap:4px;">
                <input class="cmp-prov-ruc" placeholder="RUC" maxlength="11" style="flex:1; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px;" oninput="compBuscarProveedor(this)">
                <button type="button" onclick="compBuscarProveedor(this, true)" style="height:26px; width:26px; border-radius:6px; background:#059669; color:#fff; border:0; font-weight:900; cursor:pointer; font-size:10px;">🌞</button>
            </div>
        </td>
        <td><input class="cmp-prov-precio" type="number" step="0.01" value="0" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px; text-align:right;" oninput="compRecalcularTodo()"></td>
        <td><input class="cmp-prov-subtotal" type="number" step="0.01" value="0" readonly style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px; text-align:right; background:#F1F5F9; font-weight:900;"></td>
        <td><input class="cmp-prov-plazo" type="number" value="0" min="0" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; padding:0 6px; font-size:11px; text-align:center;" oninput="compRecalcularTodo()"></td>
        <td>
            <select class="cmp-prov-cond" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; font-size:10px; padding:0 4px;">
                <option value="Contado">Contado</option>
                <option value="Crédito 15 días">Crédito 15 días</option>
                <option value="Crédito 30 días">Crédito 30 días</option>
                <option value="Crédito 45 días">Crédito 45 días</option>
                <option value="Crédito 60 días">Crédito 60 días</option>
                <option value="Crédito 90 días">Crédito 90 días</option>
            </select>
        </td>
        <td>
            <select class="cmp-prov-garantia" style="width:100%; border:1px solid #E5E7EB; border-radius:6px; height:26px; font-size:10px; padding:0 4px;">
                <option value="Sin garantía">Sin garantía</option>
                <option value="3 meses">3 meses</option>
                <option value="6 meses">6 meses</option>
                <option value="1 año">1 año</option>
                <option value="2 años">2 años</option>
            </select>
        </td>
        <td style="text-align:center;">
            <button type="button" onclick="this.closest('tr').remove(); compReordenar(); compRecalcularTodo();" style="background:#FEE2E2; border:0; color:#DC2626; cursor:pointer; font-size:12px; font-weight:900; padding:3px 7px; border-radius:6px;">✕</button>
        </td>
    `;
    tbody.appendChild(tr);
    compRecalcularTodo();
}

function compReordenar() {
    const rows = document.querySelectorAll('#comparativoItemsBody tr');
    rows.forEach((row, idx) => {
        row.querySelector('td:first-child').textContent = idx + 1;
    });
}

function compBuscarProveedor(input, force = false) {
    const row = input.closest('tr');
    const rucInput = row.querySelector('.cmp-prov-ruc');
    const nombreInput = row.querySelector('.cmp-prov-nombre');
    const ruc = (rucInput.value || '').replace(/\D/g, '').trim();

    if (!force) {
        clearTimeout(row._timer);
        row._timer = setTimeout(() => {
            if (ruc.length === 11) compBuscarProveedor(rucInput, true);
        }, 700);
        return;
    }

    if (ruc.length !== 11) { showToast('⚠️ RUC de 11 dígitos requerido', 'warning'); return; }

    fetch(`/compras/api/proveedores/buscar?q=${ruc}`)
        .then(r => r.json())
        .then(data => {
            if (data.success && data.data && data.data.length > 0) {
                const p = data.data[0];
                nombreInput.value = p.razon_social || '';
                showToast(`✅ Proveedor: ${p.razon_social}`, 'success');
                return;
            }
            return fetch(`/api/sunat/consulta?ruc=${ruc}`)
                .then(r => r.json())
                .then(sunat => {
                    if (sunat.success) {
                        nombreInput.value = sunat.razon_social || '';
                        showToast('🌞 Datos cargados desde SUNAT', 'info');
                    } else {
                        showToast('⚠️ No se encontró el RUC', 'warning');
                    }
                });
        })
        .catch(e => { console.error(e); showToast('❌ Error consultando proveedor', 'error'); });
}

function compRecalcularTodo() {
    const cant = parseFloat(document.getElementById('compCantidad')?.value) || 1;
    const rows = document.querySelectorAll('#comparativoItemsBody tr');

    let mejorPrecio = null;
    let mejorPlazo = null;
    let mejorProveedor = '-';
    let mejorProveedorPlazo = '-';

    rows.forEach(row => {
        const precio = parseFloat(row.querySelector('.cmp-prov-precio')?.value) || 0;
        const subtotal = precio * cant;
        const subEl = row.querySelector('.cmp-prov-subtotal');
        if (subEl) subEl.value = subtotal.toFixed(2);

        const plazo = parseFloat(row.querySelector('.cmp-prov-plazo')?.value) || 0;
        const nombre = row.querySelector('.cmp-prov-nombre')?.value || '-';

        if (precio > 0 && (mejorPrecio === null || precio < mejorPrecio)) {
            mejorPrecio = precio;
            mejorProveedor = nombre;
        }
        if (plazo > 0 && (mejorPlazo === null || plazo < mejorPlazo)) {
            mejorPlazo = plazo;
            mejorProveedorPlazo = nombre;
        }
    });

    const moneda = document.getElementById('compMoneda')?.value || 'Soles (S/)';
    const sym = moneda.includes('$') ? '$' : 'S/';

    document.getElementById('compMejorPrecio').value = mejorPrecio !== null ? `${sym} ${mejorPrecio.toFixed(2)}` : '-';
    document.getElementById('compMejorProveedor').value = mejorProveedor;
    document.getElementById('compMejorPlazo').value = mejorPlazo !== null ? `${mejorPlazo} días` : '-';
    document.getElementById('compMejorProveedorPlazo').value = mejorProveedorPlazo;

    // Resaltar mejor precio
    rows.forEach(row => {
        row.style.background = '';
        const precio = parseFloat(row.querySelector('.cmp-prov-precio')?.value) || 0;
        if (precio > 0 && precio === mejorPrecio) {
            row.style.background = '#DCFCE7';
        }
    });
}

// Inicializar con una fila al abrir
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('comparativoModal');
    if (modal) {
        const observer = new MutationObserver(() => {
            if (modal.classList.contains('show')) {
                const tbody = document.getElementById('comparativoItemsBody');
                if (tbody && tbody.children.length === 0) addComparativoRow();
            }
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
    }
});

console.log('✅ Funciones del modal Comparativo cargadas');
</script>
