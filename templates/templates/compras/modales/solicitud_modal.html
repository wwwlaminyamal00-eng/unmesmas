<!-- MODAL SOLICITUD DE COMPRA - VERSIÓN PROFESIONAL -->
<div class="modal-bg" id="solicitudModal">
    <div class="modal-box" style="width:min(1100px,96vw); max-height:92vh; display:flex; flex-direction:column;">
        <div class="modal-head" style="padding:10px 18px; min-height:42px; flex-shrink:0;">
            <div>
                <div class="modal-title" id="solicitudModalTitle">📋 Nueva solicitud de compra</div>
                <p style="color:#94A3B8; font-size:11px; font-weight:700; margin:2px 0 0 0;" id="solicitudModalSub">
                    Registra el requerimiento interno antes de iniciar el proceso de compra
                </p>
            </div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('solicitudModal')">✕ Cerrar</button>
        </div>

        <div class="modal-body" id="solicitudForm" style="flex:1 1 auto; overflow-y:auto; padding:14px 18px; background:#F8FAFC;">

            <!-- SECCIÓN 1: DATOS GENERALES -->
            <div class="ficha-section">
                <div class="ficha-section-title">📄 Datos de la solicitud</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>N° Solicitud <span class="text-danger">*</span></label>
                        <input id="solNumero" placeholder="SOL-20260713-0001" readonly style="background:#F1F5F9; font-weight:900; color:#2563EB;">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha solicitud <span class="text-danger">*</span></label>
                        <input id="solFecha" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha requerida <span class="text-danger">*</span></label>
                        <input id="solFechaRequerida" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Prioridad <span class="text-danger">*</span></label>
                        <select id="solUrgencia">
                            <option value="Baja">🟢 Baja</option>
                            <option value="Media" selected>🟡 Media</option>
                            <option value="Alta">🟠 Alta</option>
                            <option value="Urgente">🔴 Urgente</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Área solicitante <span class="text-danger">*</span></label>
                        <select id="solArea">
                            <option value="">-- Seleccione --</option>
                            <option value="Almacén">Almacén</option>
                            <option value="Producción">Producción</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                            <option value="Ventas">Ventas</option>
                            <option value="Administración">Administración</option>
                            <option value="Logística">Logística</option>
                            <option value="TI">TI</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Centro de costo</label>
                        <select id="solCentroCosto">
                            <option value="">-- Opcional --</option>
                            <option value="CC-001">CC-001 Administración</option>
                            <option value="CC-002">CC-002 Producción</option>
                            <option value="CC-003">CC-003 Ventas</option>
                            <option value="CC-004">CC-004 Logística</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Solicitante <span class="text-danger">*</span></label>
                        <input id="solSolicitante" placeholder="Nombre completo">
                    </div>
                    <div class="form-field col-3">
                        <label>Teléfono / Anexo</label>
                        <input id="solTelefono" placeholder="999 999 999">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: DETALLE DEL PRODUCTO -->
            <div class="ficha-section">
                <div class="ficha-section-title">
                    📦 Detalle del producto
                    <span style="font-weight:400; font-size:10px; color:#64748B;">Busca por código o escribe libremente</span>
                </div>
                <div class="ficha-grid">
                   <div class="form-field col-8">
    <label>Código / Producto</label>
    <div style="display:flex; gap:6px;">
        <input id="solCodigo" placeholder="Ej: PRD-001245" style="flex:1;">
        <button type="button" class="btn btn-green" 
                onclick="openProductSelectorCompras(items => { 
                    if (items && items.length > 0) solCargarProductoSeleccionado(items[0]); 
                })"
                style="height:30px; padding:0 14px; border-radius:9px; font-weight:900; font-size:11px; background:#16A34A; color:#fff; border:0; cursor:pointer;">
            📋 Seleccionar
        </button>
        <button type="button" onclick="solBuscarProductoBD()" style="height:30px; padding:0 12px; border-radius:9px; background:#2563EB; color:#fff; border:0; font-weight:900; cursor:pointer; font-size:11px;">🔍</button>
    </div>
</div>
                    <div class="form-field col-4">
                        <label>Unidad <span class="text-danger">*</span></label>
                        <select id="solUnidad">
                            <option value="UND">UND - Unidad</option>
                            <option value="KG">KG - Kilogramo</option>
                            <option value="LTS">LTS - Litro</option>
                            <option value="MTS">MTS - Metro</option>
                            <option value="CJA">CJA - Caja</option>
                            <option value="PQT">PQT - Paquete</option>
                        </select>
                    </div>
                    <div class="form-field col-12">
                        <label>Descripción del producto <span class="text-danger">*</span></label>
                        <input id="solProducto" placeholder="Descripción detallada del producto o servicio" maxlength="200">
                    </div>
                    <div class="form-field col-3">
                        <label>Cantidad <span class="text-danger">*</span></label>
                        <input id="solCantidad" type="number" value="1" min="0.01" step="0.01">
                    </div>
                    <div class="form-field col-3">
                        <label>Precio unitario referencial</label>
                        <input id="solPrecioUnitario" type="number" step="0.01" value="0.00" oninput="solCalcularTotal()">
                    </div>
                    <div class="form-field col-3">
                        <label>Moneda</label>
                        <select id="solMoneda">
                            <option value="Soles (S/)">Soles (S/)</option>
                            <option value="Dólares ($)">Dólares ($)</option>
                        </select>
                    </div>
                    <div class="form-field col-3">
                        <label>Subtotal referencial</label>
                        <input id="solTotalRef" readonly style="background:#F1F5F9; font-weight:900; color:#059669; text-align:right;">
                    </div>
                    <div class="form-field col-6">
                        <label>Proveedor sugerido (opcional)</label>
                        <input id="solProveedorSugerido" placeholder="Nombre del proveedor sugerido">
                    </div>
                    <div class="form-field col-6">
                        <label>RUC proveedor sugerido</label>
                        <div style="display:flex; gap:6px;">
                            <input id="solRucProveedor" placeholder="11 dígitos" maxlength="11" style="flex:1;" oninput="solBuscarProveedorSUNAT()">
                            <button type="button" onclick="solBuscarProveedorSUNAT(true)" style="height:30px; padding:0 12px; border-radius:9px; background:#059669; color:#fff; border:0; font-weight:900; cursor:pointer; font-size:11px;">🌞 SUNAT</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: JUSTIFICACIÓN Y OBSERVACIONES -->
            <div class="ficha-section">
                <div class="ficha-section-title">📝 Justificación y observaciones</div>
                <div class="ficha-grid">
                    <div class="form-field col-12">
                        <label>Justificación de la solicitud <span class="text-danger">*</span></label>
                        <textarea id="solJustificacion" placeholder="Motivo por el cual se solicita esta compra..." rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="form-field col-12">
                        <label>Observaciones adicionales</label>
                        <textarea id="solObservaciones" placeholder="Información adicional relevante..." rows="2" maxlength="300"></textarea>
                    </div>
                </div>
            </div>

        </div>

        <div class="modal-foot" style="padding:10px 18px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #E5E7EB; background:#fff; flex-shrink:0;">
            <button class="btn btn-secondary" onclick="closeModal('solicitudModal')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">Cancelar</button>
            <button class="btn btn-soft" onclick="saveSolicitud('Borrador')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">💾 Guardar borrador</button>
            <button class="btn btn-primary" onclick="saveSolicitud('Pendiente')" style="height:34px; padding:0 18px; font-size:12px; border-radius:9px; font-weight:800;">📤 Enviar a aprobación</button>
        </div>
    </div>
</div>

<style>
    .ficha-section {
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        background: #FFFFFF;
        margin-bottom: 12px;
        overflow: hidden;
    }
    .ficha-section-title {
        padding: 10px 14px;
        background: #F8FAFC;
        border-bottom: 1px solid #E2E8F0;
        color: #7F1D1D;
        font-size: 13px;
        font-weight: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .ficha-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 10px;
        padding: 12px;
    }
    .ficha-grid .form-field { min-width: 0; }
    .ficha-grid .form-field label {
        display: block;
        font-size: 10px;
        font-weight: 950;
        color: #334155;
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.2px;
    }
    .ficha-grid .form-field input,
    .ficha-grid .form-field select,
    .ficha-grid .form-field textarea {
        width: 100%;
        border: 1px solid #E5E7EB;
        border-radius: 9px;
        background: #FFFFFF;
        outline: none;
        color: #0F172A;
        font-size: 12px;
        transition: all 0.2s;
        font-family: inherit;
    }
    .ficha-grid .form-field input,
    .ficha-grid .form-field select { height: 30px; padding: 0 10px; }
    .ficha-grid .form-field textarea { padding: 8px 10px; min-height: 60px; resize: vertical; }
    .ficha-grid .form-field input:focus,
    .ficha-grid .form-field select:focus,
    .ficha-grid .form-field textarea:focus {
        border-color: #EF233C;
        box-shadow: 0 0 0 3px rgba(239, 35, 60, 0.10);
    }
    .ficha-grid .col-3 { grid-column: span 3; }
    .ficha-grid .col-4 { grid-column: span 4; }
    .ficha-grid .col-6 { grid-column: span 6; }
    .ficha-grid .col-8 { grid-column: span 8; }
    .ficha-grid .col-12 { grid-column: span 12; }
    .text-danger { color: #DC2626 !important; font-weight: 900; }

    @media (max-width: 768px) {
        .ficha-grid .col-3,
        .ficha-grid .col-4,
        .ficha-grid .col-6,
        .ficha-grid .col-8 { grid-column: span 12; }
    }
</style>

<script>
// ============================================================
// FUNCIONES PARA EL MODAL DE SOLICITUD DE COMPRA
// ============================================================

// Cargar datalist de productos
function solCargarDatalistProductos() {
    const dl = document.getElementById('solProductList');
    if (!dl) return;
    const productos = (typeof PRODUCTOS_MAESTROS !== 'undefined' && PRODUCTOS_MAESTROS.length > 0)
        ? PRODUCTOS_MAESTROS
        : (window.PRODUCTOS_MAESTROS || []);
    dl.innerHTML = productos.map(p => {
        const label = `${p.codigo || ''} - ${p.producto || p.descripcion || ''}${p.marca ? ' (' + p.marca + ')' : ''}`;
        return `<option value="${p.codigo || ''}" label="${label}"></option>`;
    }).join('');
}

// Buscar producto por código (autocompletar)
function solBuscarProducto(codigo) {
    if (!codigo || codigo.length < 2) return;
    const productos = (typeof PRODUCTOS_MAESTROS !== 'undefined' && PRODUCTOS_MAESTROS.length > 0)
        ? PRODUCTOS_MAESTROS
        : (window.PRODUCTOS_MAESTROS || []);
    const prod = productos.find(p => (p.codigo || '').toLowerCase() === codigo.toLowerCase());
    if (prod) {
        document.getElementById('solProducto').value = prod.producto || prod.descripcion || '';
        document.getElementById('solPrecioUnitario').value = parseFloat(prod.valorVenta) || 0;
        document.getElementById('solUnidad').value = prod.um || 'UND';
        solCalcularTotal();
    }
}

// Buscar producto en BD (por si no está en memoria)
async function solBuscarProductoBD() {
    const codigo = document.getElementById('solCodigo').value.trim();
    if (!codigo) { showToast('⚠️ Ingresa un código de producto', 'warning'); return; }
    try {
        const resp = await fetch(`/productos/api/productos?q=${encodeURIComponent(codigo)}`);
        const data = await resp.json();
        if (data.success && data.data && data.data.length > 0) {
            const p = data.data[0];
            document.getElementById('solCodigo').value = p.codigo || codigo;
            document.getElementById('solProducto').value = p.descripcion || p.nombre || '';
            document.getElementById('solPrecioUnitario').value = parseFloat(p.precio_unitario || p.precio_venta || 0);
            document.getElementById('solUnidad').value = p.unidad || 'UND';
            solCalcularTotal();
            showToast(`✅ Producto encontrado: ${p.descripcion || p.nombre}`, 'success');
        } else {
            showToast('❌ Producto no encontrado. Puedes escribir la descripción manualmente.', 'warning');
        }
    } catch (e) {
        console.error(e);
        showToast('❌ Error consultando productos', 'error');
    }
}

// Calcular total referencial
function solCalcularTotal() {
    const cant = parseFloat(document.getElementById('solCantidad')?.value) || 0;
    const precio = parseFloat(document.getElementById('solPrecioUnitario')?.value) || 0;
    const total = cant * precio;
    const el = document.getElementById('solTotalRef');
    if (el) el.value = total.toFixed(2);
}


function solCargarProductoSeleccionado(prod) {
    document.getElementById('solCodigo').value = prod.codigo || '';
    document.getElementById('solProducto').value = prod.producto || prod.descripcion || '';
    document.getElementById('solUnidad').value = prod.um || 'UND';
    document.getElementById('solPrecioUnitario').value = prod.precio_unitario || 0;
    document.getElementById('solCantidad').value = prod.cantidad || 1;
    solCalcularTotal();
}

let _solRucTimer = null;

async function solBuscarProveedorSUNAT(force = false) {
    const rucInput = document.getElementById('solRucProveedor');
    const ruc = (rucInput.value || '').replace(/\D/g, '').trim();

    if (!force) {
        clearTimeout(_solRucTimer);
        _solRucTimer = setTimeout(() => {
            if (ruc.length === 11) solBuscarProveedorSUNAT(true);
        }, 900);
        return;
    }

    if (ruc.length !== 11) {
        showToast('⚠️ El RUC debe tener 11 dígitos', 'warning');
        return;
    }

    // 🔽 Consultar con modales visuales
    await consultarRUCConspinner(ruc, (proveedor) => {
        // Se ejecuta al pulsar "Usar estos datos"
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };

        set('solProveedorSugerido', proveedor.razon_social || proveedor.razon_comercial || '');
        set('solRucProveedor', proveedor.ruc || ruc);
        set('solContactoProveedor', proveedor.contacto || '');
        set('solTelefonoProveedor', proveedor.telefono || '');
        set('solEmailProveedor', proveedor.email || '');
        set('solDireccionProveedor', proveedor.direccion || '');

        const condEl = document.getElementById('solCondicionPago');
        if (condEl && proveedor.condicion_pago) condEl.value = proveedor.condicion_pago;

        const monEl = document.getElementById('solMoneda');
        if (monEl && proveedor.moneda) {
            for (let opt of monEl.options) {
                if (opt.value === proveedor.moneda) { opt.selected = true; break; }
            }
        }

        showToast(`✅ Datos aplicados: ${proveedor.razon_social}`, 'success');
    });
}

// Inicializar eventos al abrir el modal
document.addEventListener('DOMContentLoaded', function() {
    const cantEl = document.getElementById('solCantidad');
    if (cantEl) cantEl.addEventListener('input', solCalcularTotal);

    // Cuando el modal de solicitud se muestre, cargar datalist
    const observer = new MutationObserver(() => {
        const modal = document.getElementById('solicitudModal');
        if (modal && modal.classList.contains('show')) {
            solCargarDatalistProductos();
        }
    });
    const modal = document.getElementById('solicitudModal');
    if (modal) observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
});

console.log('✅ Funciones del modal de Solicitud cargadas');
</script>
