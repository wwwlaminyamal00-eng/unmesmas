
<!-- MODAL CARGA MASIVA -->
<div class="modal-bg" id="bulkModal">
  <div class="modal-box modal-wide">
    <div class="modal-head"><div class="modal-title" id="bulkTitle">Carga masiva</div><button class="btn btn-secondary" id="bulkClose" style="color:#fff;border-color:#fff;background:transparent">Cerrar</button></div>
    <div class="modal-body">
      <div class="help-box" id="bulkHelp"></div>
      <div class="form-grid">
        <div class="form-field"><label>Submódulo</label><select id="bulkModule"></select></div>
        <div class="form-field"><label>Separador</label><select id="bulkSep"><option value=";">Punto y coma (;)</option><option value=",">Coma (,)</option></select></div>
        <div class="form-field full"><label>Pega aquí tu CSV</label><textarea id="bulkText" style="min-height:170px"></textarea></div>
      </div>
      <div class="csv-template" id="bulkTemplate"></div>
      <div class="preview-box" id="bulkPreview"></div>
    </div>
    <div class="modal-foot"><span style="color:#64748B;font-size:11px">Primero valida, luego importa.</span><div style="display:flex;gap:8px"><button class="btn btn-secondary" id="btnPreview">Validar</button><button class="btn btn-primary" id="btnImport">Importar</button></div></div>
  </div>
</div>
