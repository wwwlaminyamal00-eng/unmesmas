<!-- MODAL CONFIRMAR -->
<div class="modal-bg" id="confirmModal">
  <div class="confirm-modal">
    <div class="confirm-head"><span>Confirmar guardado</span><button class="confirm-close" id="confirmClose">×</button></div>
    <div class="confirm-body">
      <div class="confirm-q">¿Estás segura de guardar este registro?</div>
      <div class="confirm-txt">Revisa los datos principales. Esta acción quedará registrada en la bitácora.</div>
      <div class="confirm-summary" id="confirmSummary"></div>
    </div>
    <div class="confirm-foot"><button class="confirm-btn confirm-cancel" id="confirmCancel">Cancelar</button><button class="confirm-btn confirm-ok" id="confirmOk">Sí, guardar</button></div>
  </div>
</div>
