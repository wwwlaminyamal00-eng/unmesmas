<!-- MODAL DESPACHO -->
<div class="modal-bg" id="despachoModal">
    <div class="modal-box" style="width:min(1100px,96vw)">
        <div class="modal-head">
            <div class="modal-title" id="despachoModalTitle">🚚 Despacho</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('despachoModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="despachoForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('despachoModal')">Cancelar</button>
            <button class="btn btn-soft" onclick="saveDespacho('Pendiente despacho')">💾 Guardar pendiente</button>
            <button class="btn btn-green" onclick="saveDespacho('Despachado')">🚚 Marcar despachado</button>
        </div>
    </div>
</div>
