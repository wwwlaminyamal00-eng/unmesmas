
<!-- MODAL DEVOLUCIÓN -->
<div class="modal-bg" id="devolucionModal">
    <div class="modal-box" style="width:min(1100px,96vw)">
        <div class="modal-head">
            <div class="modal-title" id="devolucionModalTitle">🔄 Devolución</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('devolucionModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="devolucionForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('devolucionModal')">Cancelar</button>
            <button class="btn btn-soft" onclick="saveDevolucion('Pendiente')">💾 Guardar pendiente</button>
            <button class="btn btn-blue" onclick="saveDevolucion('En revisión')">📤 Enviar a revisión</button>
            <button class="btn btn-green" onclick="saveDevolucion('Aprobada')">✅ Aprobar</button>
        </div>
    </div>
</div>
