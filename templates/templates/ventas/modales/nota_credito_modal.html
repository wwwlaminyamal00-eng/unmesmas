<!-- MODAL NOTA DE CRÉDITO -->
<div class="modal-bg" id="notaCreditoModal">
    <div class="modal-box" style="width:min(1100px,96vw)">
        <div class="modal-head">
            <div class="modal-title" id="notaCreditoModalTitle">📝 Nota de crédito</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('notaCreditoModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="notaCreditoForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('notaCreditoModal')">Cancelar</button>
            <button class="btn btn-soft" onclick="saveNotaCredito('Borrador')">💾 Guardar como  borrador</button>
            <button class="btn btn-green" onclick="saveNotaCredito('Emitida')">📄 Emitir nota</button>
        </div>
    </div>
</div>
