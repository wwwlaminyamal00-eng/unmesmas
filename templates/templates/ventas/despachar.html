{% extends "ventas/index.html" %}

{% block content %}
<div id="despacharContent">
    <div class="panel">
        <div class="clean-header">
            <div class="master-title-wrap">
                <div class="master-title">🚚 Despachar</div>
                <div class="master-subtitle">Pendientes de despacho e historial</div>
            </div>
            <div class="search-box">
                <input id="despachoSearch" placeholder="Buscar por despacho / cliente / PC...">
            </div>
            <div class="clean-actions">
                <select id="despachoStatus">
                    <option value="">Todos los estados</option>
                    <option value="Pendiente despacho">Pendiente despacho</option>
                    <option value="En preparación">En preparación</option>
                    <option value="Despachado">Despachado</option>
                    <option value="Entregado">Entregado</option>
                </select>
                <button class="btn btn-secondary" onclick="exportData('despachos')">📥 Exportar</button>
            </div>
        </div>
        <div class="table-scroll">
            <table class="master-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Fecha despacho</th>
                        <th>Estado</th>
                        <th>Despacho</th>
                        <th>PC</th>
                        <th>Cliente</th>
                        <th>Factura</th>
                        <th>Guía</th>
                        <th>Destino</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="despachoRows"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
