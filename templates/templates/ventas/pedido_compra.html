<!-- MODAL PEDIDO COMPRA - Estilo SAP -->
<div class="modal-bg" id="pedidoCompraModal">
    <div class="modal-box" style="width:min(1200px,96vw); max-height:92vh;">
        <div class="modal-head">
            <div>
                <div class="modal-title" id="pedidoCompraModalTitle">Crear PC Cliente</div>
                <p style="color:#94A3B8; font-size:12px; font-weight:800;" id="modalSub">Primero se valida. No comprar ni despachar si existe observación.</p>
            </div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('pedidoCompraModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="pedidoCompraForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('pedidoCompraModal')">Cancelar</button>
            <button class="btn btn-danger" onclick="savePedidoCompra('PC observado')">⚠️ Guardar observado</button>
            <button class="btn btn-primary" onclick="savePedidoCompra('PC conforme')">✅ Guardar PC Cliente</button>
        </div>
    </div>
</div>
