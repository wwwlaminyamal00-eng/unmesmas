{% extends "ventas/index.html" %}

{% block content %}
<!-- Este contenido se renderiza dinámicamente desde ventas.js -->
<div id="cotizacionesContent">
    <div class="status-board" id="cotizacionesKPI">
        <!-- KPIs se generan desde JavaScript -->
    </div>
    <div class="panel">
        <div class="clean-header">
            <div class="master-title-wrap">
                <div class="master-title">Base datos: Cotizaciones</div>
                <div class="master-subtitle">Listado comercial con trazabilidad</div>
            </div>
            <div class="search-box">
                <input id="qSearch" placeholder="Buscar por N° cotización / RUC / Cliente / Descripción...">
            </div>
            <div class="clean-actions">
                <select id="qStatus">
                    <option value="">Todos los estados</option>
                    <option value="Borrador">Borrador</option>
                    <option value="En revisión">En revisión</option>
                    <option value="Validada">Validada</option>
                    <option value="Generada">Generada</option>
                    <option value="Aceptada">Aceptada</option>
                    
                </select>
                <button class="btn btn-secondary" onclick="exportData('cotizaciones')">📥 Exportar</button>
                <button class="btn btn-primary btn-create" onclick="openCotizacionModal()">+ Nueva cotización</button>
            </div>
        </div>
        <div class="table-scroll">
            <table class="master-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Fecha / Hora</th>
                        <th>Estado</th>
                        <th>N° Cotización</th>
                        <th>RUC</th>
                        <th>Cód. Cliente</th>
                        <th>Razón social (Cliente) </th>
                        <th>Descripción principal</th>
                        <th>Monto total</th>
                        <th>Cond. pago</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="qRows"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
