
{% extends "ventas/index.html" %}

{% block content %}
<div id="comprobantesContent">
    <div class="panel">
        <div class="clean-header">
            <div class="master-title-wrap">
                <div class="master-title">🧾 Facturas y Boletas</div>
                <div class="master-subtitle">Comprobantes emitidos a clientes</div>
            </div>
            <div class="search-box">
                <input id="comprobanteSearch" placeholder="Buscar por documento / cliente / RUC...">
            </div>
            <div class="clean-actions">
                <select id="comprobanteStatus">
                    <option value="">Todos los estados</option>
                    <option value="Borrador">Borrador</option>
                    <option value="Emitido">Emitido</option>
                    <option value="Anulado">Anulado</option>
                </select>
                <button class="btn btn-secondary" onclick="exportData('comprobantes')">📥 Exportar</button>
           <button class="btn btn-primary btn-create" onclick="window.openComprobanteModal()">+ Nueva factura</button>
            </div>
        </div>
        <div class="table-scroll">
            <table class="master-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Tipo</th>
                        <th>Documento</th>
                        <th>RUC</th>
                        <th>Cliente</th>
                        <th>Cotización</th>
                        <th>Monto</th>
                        <th>Cond. Pago</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="comprobanteRows"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
