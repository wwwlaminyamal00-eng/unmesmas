services:
  - type: web
    name: Pruebas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      # Las credenciales NO se escriben aquí: configúralas en el panel de Render
      # (Environment > Add Environment Variable). sync:false evita que se suban al repo.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Hora de Perú para el ERP (Kardex y fechas)
      - key: TZ
        value: America/Lima
      # Clave para consultar RUC en SUNAT (decolecta.com / apis.net.pe). Opcional: sin ella se buscan
      # solo los RUC que ya están en clientes/proveedores y el resto se escribe a mano.
      - key: DECOLECTA_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
