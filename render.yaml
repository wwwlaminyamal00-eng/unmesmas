services:
  - type: web
    name: Pruebas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      # Las credenciales NO se escriben aquí: configúralas en el panel de Render
      # (Environment > Add Environment Variable). sync:false evita que se suban al repo.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.0
